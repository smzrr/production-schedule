<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="SMZRR 2027 Hero Film 제작 로드맵과 AI 영화제 출품 데이터베이스를 한 곳에서 보는 대시보드">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<title>AI 영상 제작 스케줄</title>
<style>
:root{
  --bg:#fbfaff;
  --surface:#ffffff;
  --surface-alt:#f3eefc;
  --ink:#211b36;
  --ink-dim:#5b5476;
  --ink-faint:#948cb0;
  --border:#e4ddf7;
  --border-soft:#ede8fa;
  --accent:#7351c9;
  --accent-ink:#ffffff;
  --accent-soft:#e7dffa;
  --good:#2f6f45;
  --good-soft:#dbead9;
  --warn:#a63b1f;
  --warn-soft:#f6d9cd;
  --info:#2a5f7a;
  --info-soft:#d9e7ee;
  --muted-soft:#ede8fa;
  --shadow:0 1px 2px rgba(41,25,82,.07), 0 8px 24px -12px rgba(41,25,82,.2);
  --radius:10px;
  --accent-gradient:linear-gradient(135deg, #5632B0 0%, #7351C9 40%, #9D7FE6 72%, #B6A0EC 100%);
  --accent-gradient-h:linear-gradient(90deg, #5632B0 0%, #7351C9 40%, #9D7FE6 72%, #B6A0EC 100%);
  --font-kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150f26;
    --surface:#1f1836;
    --surface-alt:#271f42;
    --ink:#f1ecfb;
    --ink-dim:#c3b8e0;
    --ink-faint:#8f81b8;
    --border:#3a2f5c;
    --border-soft:#2c2549;
    --accent:#b6a0ec;
    --accent-ink:#1e1533;
    --accent-soft:#352a57;
    --good:#7cc493;
    --good-soft:#20301f;
    --warn:#e58362;
    --warn-soft:#3a231a;
    --info:#7fb8d6;
    --info-soft:#1c2f37;
    --muted-soft:#2c2549;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#150f26;
  --surface:#1f1836;
  --surface-alt:#271f42;
  --ink:#f1ecfb;
  --ink-dim:#c3b8e0;
  --ink-faint:#8f81b8;
  --border:#3a2f5c;
  --border-soft:#2c2549;
  --accent:#b6a0ec;
  --accent-ink:#1e1533;
  --accent-soft:#352a57;
  --good:#7cc493;
  --good-soft:#20301f;
  --warn:#e58362;
  --warn-soft:#3a231a;
  --info:#7fb8d6;
  --info-soft:#1c2f37;
  --muted-soft:#2c2549;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-kr);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);}
a{color:var(--accent);}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}

/* header */
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:20px;margin-bottom:18px;border-bottom:3px solid transparent;border-image:var(--accent-gradient-h) 1;
}
.brand{display:flex;flex-direction:column;gap:6px;}
.brand-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
.brand h1{
  margin:0;font-size:clamp(26px, 20px + 2vw, 38px);font-weight:800;letter-spacing:-.02em;text-wrap:balance;color:var(--ink);
}
.brand p{margin:0;color:var(--ink-dim);font-size:13.5px;}
.today-chip{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--ink-dim);box-shadow:var(--shadow);
  white-space:nowrap;
}
.today-chip b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;}

/* nav */
nav.tabs{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;
  border-bottom:1px solid var(--border);padding-bottom:0;
}
nav.tabs button{
  appearance:none;border:none;background:transparent;color:var(--ink-dim);
  font-family:inherit;font-size:13.5px;font-weight:700;padding:10px 14px;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s, border-color .15s;
  letter-spacing:-.01em;
}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button.active{color:var(--accent);border-bottom:2px solid transparent;border-image:var(--accent-gradient-h) 1;}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.panel{display:none;flex-direction:column;gap:22px;}
.panel.active{display:flex;}

section.block{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);
}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.block-head h2{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em;}
.block-head .sub{color:var(--ink-faint);font-size:12px;}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 4px;}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:820px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
}
.kpi .label{font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;}
.kpi .value{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.kpi .value small{font-size:13px;font-weight:700;color:var(--ink-dim);}
.kpi .foot{font-size:12px;color:var(--ink-dim);}
.kpi.warn .value{color:var(--warn);}
.kpi.good .value{color:var(--good);}
.kpi.accent .value{color:var(--accent);}

/* alert banner */
.alert{
  display:flex;gap:14px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb, var(--warn) 35%, var(--border));
  border-radius:var(--radius);padding:16px 18px;
}
.alert .icon{font-size:20px;line-height:1;}
.alert h3{margin:0 0 4px;font-size:14.5px;font-weight:800;color:var(--warn);}
.alert p{margin:0 0 10px;font-size:13px;color:var(--ink-dim);}
.alert-items{display:flex;flex-direction:column;gap:6px;}
.alert-item{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap;}
.alert-item a{font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--warn);}
.alert-item a:hover{color:var(--warn);}

/* pills / badges */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6;
}
.pill.good{background:var(--good-soft);color:var(--good);}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.info{background:var(--info-soft);color:var(--info);}
.pill.muted{background:var(--muted-soft);color:var(--ink-faint);}
.pill.accent{background:var(--accent-soft);color:var(--accent);}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.tier{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;
  border-radius:6px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
}
.tier.top{background:var(--accent-gradient);color:#fff;}
.tier.mid{background:var(--accent-soft);color:var(--accent);}
.tier.low{background:var(--muted-soft);color:var(--ink-faint);}

/* master timeline strip */
.gantt{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.gantt::-webkit-scrollbar{height:7px;}
.gantt::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.gantt-item{
  flex:0 0 auto;min-width:150px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  background:var(--surface-alt);
}
.gantt-item .period{font-size:10.5px;color:var(--ink-faint);font-weight:700;font-variant-numeric:tabular-nums;}
.gantt-item .phase{font-size:13px;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em;}
.gantt-item .work{font-size:11.5px;color:var(--ink-dim);line-height:1.4;}
.gantt-item.milestone{background:var(--accent-gradient);border-color:transparent;}
.gantt-item.milestone .period,.gantt-item.milestone .work{color:var(--accent-ink);opacity:.85;}
.gantt-item.milestone .phase{color:var(--accent-ink);}

/* gate cards */
.gate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:820px){.gate-row{grid-template-columns:repeat(2,1fr);}}
.gate{border:1px solid var(--border);border-radius:9px;padding:14px;background:var(--surface-alt);}
.gate .name{font-size:12.5px;font-weight:800;}
.gate .date{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin:3px 0;letter-spacing:-.01em;}
.gate .dday{font-size:12px;font-weight:700;}

/* phase detail groups */
details.phase-group{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface);}
details.phase-group + details.phase-group{margin-top:8px;}
details.phase-group summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;
  font-weight:700;font-size:13.5px;background:var(--surface-alt);
}
details.phase-group summary::-webkit-details-marker{display:none;}
details.phase-group summary::before{content:"▸";color:var(--ink-faint);font-size:11px;transition:transform .15s;}
details.phase-group[open] summary::before{transform:rotate(90deg);}
.phase-group summary .name{flex:1;}
.phase-group summary .range{font-size:11.5px;color:var(--ink-faint);font-weight:600;font-variant-numeric:tabular-nums;}
.phase-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.phase-table th{
  text-align:left;font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:8px 12px;border-bottom:1px solid var(--border-soft);
}
.phase-table td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
.phase-table tr:last-child td{border-bottom:none;}
.step-name{font-weight:700;}
.step-desc{color:var(--ink-dim);font-size:11.8px;margin-top:2px;line-height:1.45;}
.dotgroup{display:flex;gap:4px;}
.dotgroup span{width:8px;height:8px;border-radius:50%;background:var(--border);}
.dotgroup span.on.c{background:var(--info);}
.dotgroup span.on.a{background:var(--accent);}
.dotgroup span.on.p{background:var(--good);}
.nowrap{white-space:nowrap;}

/* generic table wrap */
.table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:9px;}
table.data{width:100%;border-collapse:collapse;font-size:12.8px;min-width:560px;}
table.data th{
  position:sticky;top:0;text-align:left;background:var(--surface-alt);font-size:10.8px;color:var(--ink-faint);
  font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.data td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
table.data tr:last-child td{border-bottom:none;}
table.data tr:hover td{background:var(--surface-alt);}

/* scorecard */
table.score{width:100%;border-collapse:collapse;font-size:13px;}
table.score th,table.score td{padding:8px 12px;border-bottom:1px solid var(--border-soft);text-align:center;}
table.score th{font-size:11px;color:var(--ink-faint);font-weight:700;text-align:center;}
table.score td:first-child,table.score th:first-child{text-align:left;}
table.score tr:last-child td{font-weight:800;border-bottom:none;}

/* tech level legend */
.techlvl-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media (max-width:900px){.techlvl-row{grid-template-columns:repeat(2,1fr);}}
.techlvl{border:1px solid var(--border);border-radius:9px;padding:12px;background:var(--surface-alt);}
.techlvl .badge{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:6px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;margin-bottom:6px;
}
.techlvl .def{font-size:12.5px;font-weight:800;margin-bottom:3px;}
.techlvl .ex{font-size:11.3px;color:var(--ink-dim);line-height:1.4;}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media (max-width:980px){.cal-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.cal-grid{grid-template-columns:1fr;}}
.cal-month{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface);}
.cal-month h4{margin:0;padding:9px 10px;background:var(--surface-alt);font-size:12.5px;font-weight:800;text-align:center;letter-spacing:.02em;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:9.5px;color:var(--ink-faint);font-weight:700;text-align:center;padding:6px 4px 0;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 4px 8px;}
.cal-cell{min-height:44px;border-radius:6px;padding:3px 4px;font-size:10px;background:var(--surface-alt);display:flex;flex-direction:column;gap:2px;}
.cal-cell.empty{background:transparent;}
.cal-cell .num{font-weight:700;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-dim);}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:-2px;}
.cal-cell.today .num{color:var(--accent);}
.cal-chip{border-radius:4px;padding:1px 3px;font-size:8.6px;line-height:1.25;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-chip.milestone{background:var(--accent);color:var(--accent-ink);}
.cal-chip.start{background:var(--info-soft);color:var(--info);}
.cal-chip.end{background:var(--good-soft);color:var(--good);}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-top:10px;}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.search{
  flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;
}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.chip-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);
  font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;
}
.chip-btn.active{background:var(--accent-gradient);border-color:transparent;color:#fff;}
.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.count-tag{font-size:11.5px;color:var(--ink-faint);}

/* cards grid (festival db / spec ads) */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (max-width:880px){.card-grid{grid-template-columns:1fr;}}
.fcard{border:1px solid var(--border);border-radius:9px;padding:14px 15px;background:var(--surface);display:flex;flex-direction:column;gap:8px;}
.fcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.fcard-title{font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
.fcard-loc{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.fcard-stars{font-size:12px;color:var(--accent);white-space:nowrap;}
.fcard-row{font-size:12.3px;color:var(--ink-dim);display:flex;gap:6px;}
.fcard-row b{color:var(--ink);font-weight:700;min-width:64px;flex:0 0 auto;}
.fcard details{margin-top:2px;}
.fcard details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);list-style:none;}
.fcard details summary::-webkit-details-marker{display:none;}
.fcard details summary::before{content:"자세히 보기 ▾  ";}
.fcard details[open] summary::before{content:"접기 ▴  ";}
.fcard-detail{font-size:12.2px;color:var(--ink-dim);line-height:1.55;margin-top:6px;display:flex;flex-direction:column;gap:5px;}
.fcard-detail div b{color:var(--ink);font-weight:700;}
.fcard-link{
  align-self:flex-start;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;
  border-bottom:1px solid currentColor;
}

/* stepper */
.stepper{display:flex;flex-direction:column;}
.step{display:grid;grid-template-columns:70px 20px 1fr;gap:2px;}
.step .when{font-size:11.5px;color:var(--ink-faint);font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums;}
.step .rail{display:flex;flex-direction:column;align-items:center;}
.step .rail .node{width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);margin-top:3px;}
.step .rail .line{flex:1;width:2px;background:var(--border);margin-top:2px;}
.step:last-child .rail .line{display:none;}
.step .body{padding:0 0 20px 12px;}
.step .body h4{margin:0 0 4px;font-size:13.5px;font-weight:800;}
.step .body p{margin:2px 0;font-size:12.5px;color:var(--ink-dim);}
.step .body p b{color:var(--ink);font-weight:700;}

/* today quick table row link */
.link-btn{
  font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);
  border-radius:6px;padding:4px 9px;white-space:nowrap;display:inline-block;
}
.link-btn:hover{background:var(--accent);color:var(--accent-ink);}

footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);color:var(--ink-faint);font-size:11.5px;text-align:center;}

/* scenario calendar */
.scal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (max-width:760px){.scal-grid{grid-template-columns:1fr;}}
.scal-nav{display:flex;align-items:center;gap:8px;}
.scal-nav-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;
}
.scal-nav-btn:hover{background:var(--surface-alt);}
.scal-nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.scal-today-btn{color:var(--accent);border-color:var(--accent);}
.cal-cell.clickable{cursor:pointer;}
.cal-cell.clickable:hover{outline:1.5px solid var(--accent);outline-offset:-1.5px;}
.cal-cell.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.cal-cell.s-done{background:var(--good-soft);}
.cal-cell.s-pending{background:var(--accent-soft);}
.cal-cell .s-mark{font-size:9.5px;font-weight:800;}
.cal-cell.s-done .s-mark{color:var(--good);}
.cal-cell.s-pending .s-mark{color:var(--accent);}
.cal-chip.stage{background:var(--info-soft);color:var(--info);}
.kpi-row.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:820px){.kpi-row.cols-3{grid-template-columns:1fr;}}
.progress-track{height:7px;border-radius:99px;background:var(--muted-soft);overflow:hidden;margin-top:7px;}
.progress-fill{height:100%;background:var(--accent-gradient);border-radius:99px;}

/* scenario work-log modal */
dialog#scenario-modal{
  border:1px solid var(--border);border-radius:var(--radius);padding:0;
  background:var(--surface);color:var(--ink);width:min(440px, 92vw);box-shadow:var(--shadow);
}
dialog#scenario-modal::backdrop{background:rgba(10,8,4,.5);}
.smodal-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;}
.smodal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.smodal-head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;}
.smodal-close{appearance:none;border:none;background:transparent;color:var(--ink-faint);font-size:17px;cursor:pointer;line-height:1;padding:2px;}
.smodal-close:hover{color:var(--ink);}

/* ============ HELPERS ============ */
function esc(s){ return (s===null||s===undefined) ? "" : String(s); }
function linkBtn(url, label){
  if(!url) return '<span class="count-tag">링크 없음</span>';
  return '<a class="link-btn" href="'+url+'" target="_blank" rel="noopener">'+(label||"공식 페이지 ↗")+'</a>';
}
function statusPillClass(status){
  if(status.indexOf("마감임박")>=0) return "warn";
  if(status.indexOf("모집중")>=0) return "good";
  if(status.indexOf("상시")>=0) return "info";
  return "muted";
}
// 저장된 status 문자열은 원본 조사 시점(2026-08-15) 기준. 실제 오늘 날짜와 마감일을 비교해
// 시간이 지나도 목록이 계속 정확하도록 상태를 다시 계산한다.
function liveStatus(f){
  if(!f.sortDate) return {text:f.status, cls:statusPillClass(f.status)};
  if(f.status.indexOf("마감(참고용)")>=0) return {text:f.status, cls:"muted"};
  const diff = Math.round((f.sortDate - TODAY)/86400000);
  if(diff < 0) return {text:"마감", cls:"muted"};
  if(diff === 0) return {text:"마감임박(오늘)", cls:"warn"};
  if(diff <= 7) return {text:"마감임박", cls:"warn"};
  return {text:f.status, cls:statusPillClass(f.status)};
}
function tierClass(t){
  if(t==="A"||t==="T1") return "top";
  if(t==="B"||t==="T2") return "mid";
  return "low";
}

/* ============ RENDER: ROADMAP ============ */
function parseMD(md){
  if(!md) return null;
  const m = md.split("/");
  return new Date(2026, parseInt(m[0],10)-1, parseInt(m[1],10));
}
function isMilestoneGate(g){ return /LOCK|COMPLETE|READY/i.test(g||""); }

function renderRoadmap(){
  let html = "";
  html += '<section class="block"><div class="block-head"><h2>MASTER PRODUCTION TIMELINE</h2><span class="sub">2026 제작 · 2027 출품 — 전체 흐름 한눈에 보기</span></div>';
  html += '<div class="gantt">';
  heroTimeline.forEach(t=>{
    html += '<div class="gantt-item'+(t.milestone?' milestone':'')+'"><div class="period">'+esc(t.p)+'</div><div class="phase">'+esc(t.phase)+'</div><div class="work">'+esc(t.work)+'</div></div>';
  });
  html += '</div></section>';

  // group heroDetail by phase, compute status
  const phases = [];
  heroDetail.forEach(r=>{
    let g = phases.find(p=>p.name===r.phase);
    if(!g){ g={name:r.phase, rows:[]}; phases.push(g); }
    g.rows.push(r);
  });
  phases.forEach(g=>{
    let starts=[], ends=[];
    g.rows.forEach(r=>{
      const s=parseMD(r.start), e=parseMD(r.end);
      if(s) starts.push(s); if(e) ends.push(e);
    });
    g.start = starts.length? new Date(Math.min(...starts)) : null;
    g.end = ends.length? new Date(Math.max(...ends)) : null;
    if(!g.start){ g.state="future"; }
    else if(TODAY < g.start){ g.state="upcoming"; }
    else if(g.end && TODAY > g.end){ g.state="done"; }
    else { g.state="active"; }
  });
  let openIdx = phases.findIndex(p=>p.state==="active");
  if(openIdx<0) openIdx = phases.findIndex(p=>p.state==="upcoming");
  if(openIdx<0) openIdx = 0;

  html += '<section class="block"><div class="block-head"><h2>PHASE 상세 (전체 27개 작업)</h2><span class="sub">단계를 눌러 펼쳐보세요 · 현재/다음 단계는 기본으로 열려 있습니다</span></div>';
  phases.forEach((g,i)=>{
    const rangeTxt = g.start ? (kDate(g.start)+(g.end&&g.end.getTime()!==g.start.getTime() ? " ~ "+kDate(g.end) : "")) : "연중";
    const stateBadge = g.state==="active" ? '<span class="pill warn dot">진행 예정 구간</span>' : g.state==="upcoming" ? '<span class="pill accent dot">다음 단계</span>' : g.state==="done" ? '<span class="pill muted">완료 예정 지남</span>' : '<span class="pill muted">연중</span>';
    html += '<details class="phase-group"'+(i===openIdx?' open':'')+'><summary><span class="name">'+esc(g.name)+'</span>'+stateBadge+'<span class="range nowrap">'+rangeTxt+' · '+g.rows.length+'개 작업</span></summary>';
    html += '<div class="table-wrap"><table class="phase-table"><thead><tr><th>세부 단계</th><th>기간</th><th>Gate / 승인 기준</th><th>Tech</th><th>C/A/P</th><th>상태</th></tr></thead><tbody>';
    g.rows.forEach(r=>{
      html += '<tr><td><div class="step-name">'+esc(r.step)+'</div><div class="step-desc">'+esc(r.work)+'</div></td>';
      html += '<td class="nowrap">'+(r.start? esc(r.start)+' ~ '+esc(r.end) : "연중")+'<br><span class="count-tag">'+esc(r.dur)+'</span></td>';
      html += '<td>'+esc(r.gate)+'</td>';
      html += '<td><span class="tier '+tierClass(r.tech.startsWith("L0")||r.tech.startsWith("L1")?"C":"B")+'">'+esc(r.tech)+'</span></td>';
      html += '<td><div class="dotgroup" title="Creative / AI-VFX / Post"><span class="'+(r.c?'on c':'')+'"></span><span class="'+(r.a?'on a':'')+'"></span><span class="'+(r.p?'on p':'')+'"></span></div></td>';
      html += '<td><span class="pill muted">'+esc(r.status)+'</span></td></tr>';
    });
    html += '</tbody></table></div></details>';
  });
  html += '</section>';

  html += '<section class="block"><div class="block-head"><h2>SCENARIO GREENLIGHT SCORECARD</h2><span class="sub">Option 1 / 2 / 3 평가표 — 채점 대기 중</span></div>';
  html += '<div class="table-wrap"><table class="score"><thead><tr><th>평가 항목</th><th>가중치</th><th>Option 1</th><th>Option 2</th><th>Option 3</th></tr></thead><tbody>';
  scorecard.forEach(s=>{
    html += '<tr><td>'+esc(s.item)+'</td><td>'+esc(s.weight)+'</td><td>—</td><td>—</td><td>—</td></tr>';
  });
  html += '<tr><td>TOTAL</td><td>100%</td><td>—</td><td>—</td><td>—</td></tr>';
  html += '</tbody></table></div></section>';

  html += '<section class="block"><div class="block-head"><h2>TECHNICAL LEVEL</h2><span class="sub">구현 난이도 기준</span></div><div class="techlvl-row">';
  techLevels.forEach(t=>{
    html += '<div class="techlvl"><div class="badge">'+t.lvl+'</div><div class="def">'+esc(t.def)+'</div><div class="ex">'+esc(t.ex)+'</div></div>';
  });
  html += '</div></section>';

  document.getElementById("panel-roadmap").innerHTML = html;
}

/* ============ RENDER: CALENDAR ============ */
function buildCalendarEvents(){
  const evs = {};
  function add(dateObj, label, type){
    const key = dateObj.getFullYear()+"-"+String(dateObj.getMonth()+1).padStart(2,"0")+"-"+String(dateObj.getDate()).padStart(2,"0");
    if(!evs[key]) evs[key]=[];
    evs[key].push({label:label, type:type});
  }
  heroDetail.forEach(r=>{
    if(!r.start) return;
    const s = parseMD(r.start), e = parseMD(r.end);
    add(s, r.step+" 시작", "start");
    if(e && e.getTime()!==s.getTime()){
      if(isMilestoneGate(r.gate)) add(e, r.gate, "milestone");
      else add(e, r.step+" 완료", "end");
    } else if(isMilestoneGate(r.gate)){
      evs[s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")+"-"+String(s.getDate()).padStart(2,"0")][evs[s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")+"-"+String(s.getDate()).padStart(2,"0")].length-1].type="milestone";
    }
  });
  return evs;
}

/* ============ RENDER: SCENARIO CALENDAR ============ */
const SCENARIO_STAGES = ["소재 리서치","로그라인","트리트먼트","1차 초고","2차 수정","3차 수정","Final Script"];
const SCENARIO_LOG_KEY = "smzrr_scenario_log_v1";
let scenarioLog = {};
try { scenarioLog = JSON.parse(localStorage.getItem(SCENARIO_LOG_KEY) || "{}"); } catch(e){ scenarioLog = {}; }
function saveScenarioLog(){
  try { localStorage.setItem(SCENARIO_LOG_KEY, JSON.stringify(scenarioLog)); } catch(e){ /* storage unavailable */ }
}
function dkey(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
let scalState = { year: TODAY.getFullYear(), month: TODAY.getMonth() };

function scenarioSummary(){
  const keys = Object.keys(scenarioLog).sort(); // ISO 날짜 문자열은 사전순 정렬 = 시간순 정렬
  if(keys.length===0) return {progress:0, stage:null, stageIdx:-1, lastDate:null, totalDays:0};
  const last = scenarioLog[keys[keys.length-1]];
  const stageIdx = SCENARIO_STAGES.indexOf(last.stage);
  const progress = stageIdx>=0 ? Math.round(((stageIdx+1)/SCENARIO_STAGES.length)*100) : 0;
  return {progress, stage:last.stage||null, stageIdx, lastDate:keys[keys.length-1], totalDays:keys.length};
}

function buildScenarioMonthHTML(year, month){
  const monthNames = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startDow = first.getDay();
  let html = '<div class="cal-month"><h4>'+year+'년 '+monthNames[month]+'</h4><div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="cal-days">';
  for(let i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const key = dkey(year, month, d);
    const entry = scenarioLog[key];
    const isToday = (year===TODAY.getFullYear() && month===TODAY.getMonth() && d===TODAY.getDate());
    let stateClass = "", mark = "";
    if(entry){
      if(entry.done){ stateClass=" s-done"; mark='<span class="s-mark">✓ 완료</span>'; }
      else { stateClass=" s-pending"; mark='<span class="s-mark">● 작업중</span>'; }
    }
    html += '<div class="cal-cell clickable'+(isToday?' today':'')+stateClass+'" data-date="'+key+'" role="button" tabindex="0" aria-label="'+key+' 작업 기록 '+(entry?"있음":"없음")+'"><div class="num">'+d+'</div>';
    if(entry){
      html += mark;
      if(entry.stage) html += '<div class="cal-chip stage" title="'+esc(entry.stage)+'">'+esc(entry.stage)+'</div>';
      if(entry.hours) html += '<div class="count-tag" style="font-size:8.5px">'+entry.hours+'h</div>';
    }
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderScenarioSummary(){
  const s = scenarioSummary();
  const stageIdxLabel = s.stageIdx>=0 ? (s.stageIdx+1)+" / "+SCENARIO_STAGES.length+" 단계" : "—";
  let lastDateLabel = "—", lastDateSub = "아직 기록 없음";
  if(s.lastDate){
    const p = s.lastDate.split("-").map(Number);
    const lastDateObj = new Date(p[0], p[1]-1, p[2]);
    const diff = Math.round((TODAY - lastDateObj)/86400000);
    lastDateLabel = kDate(lastDateObj);
    lastDateSub = diff===0 ? "오늘" : diff===1 ? "어제" : diff>0 ? diff+"일 전" : "예정";
  }
  let html = '<div class="kpi-row cols-3">';
  html += '<div class="kpi accent"><div class="label">전체 진행률</div><div class="value">'+s.progress+'<small>%</small></div><div class="progress-track"><div class="progress-fill" style="width:'+s.progress+'%"></div></div><div class="foot">'+(s.stage? esc(s.stage) : "기록을 시작해보세요")+'</div></div>';

  html += '<div class="kpi"><div class="label">최근 작업일</div><div class="value" style="font-size:18px">'+lastDateLabel+'</div><div class="foot">'+lastDateSub+(s.totalDays? " · 누적 "+s.totalDays+"일 기록":"")+'</div></div>';
  html += '</div>';
  return html;
}

  html += '<section class="block">';
  html += '<div class="controls" style="justify-content:space-between">';
  html += '<div class="scal-nav"><button class="scal-nav-btn" id="scal-prev">◀ 이전 달</button><button class="scal-nav-btn scal-today-btn" id="scal-today">오늘</button><button class="scal-nav-btn" id="scal-next">다음 달 ▶</button></div>';
  html += '<span class="count-tag">날짜를 클릭해서 작업 기록을 남기세요</span>';
  html += '</div>';
  html += '<div class="scal-grid">'+buildScenarioMonthHTML(y,m)+buildScenarioMonthHTML(nextY,nextM)+'</div>';
  html += '<div class="cal-legend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>작업 완료</span><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>작업함 (진행중)</span><span><i style="background:var(--surface-alt);border:1px solid var(--border)"></i>기록 없음</span></div>';
  html += '</section>';

  document.getElementById("panel-scenario").innerHTML = html;

  document.getElementById("scal-prev").addEventListener("click", ()=>{
    scalState.month--; if(scalState.month<0){ scalState.month=11; scalState.year--; }
    renderScenario();
  });
  document.getElementById("scal-next").addEventListener("click", ()=>{
    scalState.month++; if(scalState.month>11){ scalState.month=0; scalState.year++; }
    renderScenario();
  });
  document.getElementById("scal-today").addEventListener("click", ()=>{
    scalState.year = TODAY.getFullYear(); scalState.month = TODAY.getMonth();
    renderScenario();
  });
  document.querySelectorAll("#panel-scenario .cal-cell.clickable").forEach(cell=>{
    cell.addEventListener("click", ()=> openScenarioModal(cell.dataset.date));
    cell.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openScenarioModal(cell.dataset.date); } });
  });
}

function populateStageOptions(selected){
  const sel = document.getElementById("sf-stage");
  sel.innerHTML = SCENARIO_STAGES.map(s=>'<option value="'+esc(s)+'"'+(s===selected?' selected':'')+'>'+esc(s)+'</option>').join("");
}
function openScenarioModal(dateKey){
  const modal = document.getElementById("scenario-modal");
  const entry = scenarioLog[dateKey];
  const p = dateKey.split("-").map(Number);
  const dateObj = new Date(p[0], p[1]-1, p[2]);
  document.getElementById("smodal-title").textContent = kDate(dateObj)+" ("+["일","월","화","수","목","금","토"][dateObj.getDay()]+") 작업 기록";
  document.getElementById("sf-done").checked = entry ? !!entry.done : false;
  document.getElementById("sf-hours").value = (entry && entry.hours!=null) ? entry.hours : "";
  populateStageOptions(entry ? entry.stage : (scenarioSummary().stage || SCENARIO_STAGES[0]));
  document.getElementById("sf-work").value = entry ? (entry.work||"") : "";
  document.getElementById("sf-memo").value = entry ? (entry.memo||"") : "";
  document.getElementById("sf-delete").style.display = entry ? "" : "none";
  modal.dataset.date = dateKey;
  modal.showModal();
}
function initScenarioModal(){
  const modal = document.getElementById("scenario-modal");
  document.getElementById("scenario-form").addEventListener("submit", e=>{
    e.preventDefault();
    const key = modal.dataset.date;
    const hoursVal = document.getElementById("sf-hours").value;
    scenarioLog[key] = {
      done: document.getElementById("sf-done").checked,
      hours: hoursVal==="" ? null : Number(hoursVal),
      stage: document.getElementById("sf-stage").value,
      work: document.getElementById("sf-work").value.trim(),
      memo: document.getElementById("sf-memo").value.trim(),
    };
    saveScenarioLog();
    modal.close();
    renderScenario();
  });
  document.getElementById("sf-cancel").addEventListener("click", ()=> modal.close());
  document.getElementById("smodal-close-btn").addEventListener("click", ()=> modal.close());
  document.getElementById("sf-delete").addEventListener("click", ()=>{
    delete scenarioLog[modal.dataset.date];
    saveScenarioLog();
    modal.close();
    renderScenario();
  });
}

/* ============ INIT ============ */
document.getElementById("today-label").textContent = kDate(TODAY)+" ("+["일","월","화","수","목","금","토"][TODAY.getDay()]+")";
renderToday();
renderRoadmap();
renderCalendar();
renderScenario();
initScenarioModal();
renderFestivals();
renderStrategy();
renderSpecAds();
renderList2026();

document.getElementById("tabs").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
});
</script>
